[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uaq"
version = "0.1.0"
description = "Ulaanbaatar PM2.5 forecasting and monitoring-network optimisation (BSHDS4 project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
